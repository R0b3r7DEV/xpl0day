gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
    listen 80;
    server_name xpl0day.com www.xpl0day.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name xpl0day.com www.xpl0day.com;

    ssl_certificate /etc/letsencrypt/live/xpl0day.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xpl0day.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index_HTB.html;

    # --- Cabeceras de seguridad HTTP ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # unsafe-inline temporal: necesario por los <script> inline en index_HTB.html
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.anthropic.com;" always;

    # --- Bloquear acceso a directorios y ficheros ocultos (.git, .github, etc.) ---
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index_HTB.html;
    }
}
