                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>

                EQUIPOS
            </a>
            <a href="#" id="logoutBtn" class="logout-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M5.636 5.636a9 9 0 1012.728 0M12 3v9"/></svg>
                DESCONECTAR

        <div class="user-profile">
            <a href="profile_HTB.html" class="profile-link">
                <div class="avatar" id="sidebarAvatar">RT</div>
                <div class="user-info">
                    <p class="username" id="sidebarUsername">Root_User</p>
                    <p class="rank" id="sidebarRank">Script Kiddie</p>
                </div>
            </a>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
        <header class="top-bar">
            <button id="sidebar-toggle" aria-label="Abrir menú">&#9776;</button>
            <h1>Máquinas</h1>
            <div class="stats-overview">
                <div class="mini-stat">Completadas: <span id="completedCount">0</span></div>
                <div class="mini-stat">Total: <span>12</span></div>
            </div>
        </header>

        <!-- BARRA DE FILTROS Y BÚSQUEDA -->
        <section class="filters-bar">
            <div class="search-wrapper">
                <span class="search-icon">⌕</span>
                <input type="text" id="searchInput" placeholder="Buscar máquina..." />
            </div>
            <div class="filter-group">
                <span class="filter-label">DIFICULTAD:</span>
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn easy" data-filter="easy">Fácil</button>
                <button class="filter-btn medium" data-filter="medium">Media</button>
                <button class="filter-btn hard" data-filter="hard">Difícil</button>
                <button class="filter-btn insane" data-filter="insane">Insane</button>
            </div>
            <div class="filter-group">
                <span class="filter-label">SO:</span>
                <button class="filter-btn active" data-os="all">Todos</button>
                <button class="filter-btn" data-os="linux">🐧 Linux</button>
                <button class="filter-btn" data-os="windows">🪟 Windows</button>
            </div>
            <div class="filter-group">
                <span class="filter-label">ESTADO:</span>
                <button class="filter-btn active" data-status="all">Todos</button>
                <button class="filter-btn" data-status="active">Activa</button>
                <button class="filter-btn" data-status="retired">Retirada</button>
                <button class="filter-btn" data-status="completed">Completada</button>
            </div>
        </section>

        <!-- GRID DE MÁQUINAS -->
        <section class="machines-grid" id="machinesGrid">
            <!-- Generado por JS -->
        </section>

        <!-- MENSAJE SIN RESULTADOS -->
        <div class="no-results" id="noResults" style="display:none;">
            <p>[ No se encontraron máquinas con esos filtros ]</p>
        </div>

    </main>

    <script src="js/machines-logic_HTB.js"></script>
    <script>
        // Hamburguesa: mostrar/ocultar sidebar en móvil
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebar       = document.querySelector('.sidebar');
        const overlay       = document.getElementById('sidebarOverlay');
        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', function() {
                sidebar.classList.toggle('sidebar-open');
                overlay.classList.toggle('active');
            });
            overlay.addEventListener('click', function() {
                sidebar.classList.remove('sidebar-open');
                overlay.classList.remove('active');
            });
        }
    </script>
    <script src="js/enigma.js"></script>

</body>
</html>
