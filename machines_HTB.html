<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XPL0DAY | Máquinas</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/machines_HTB.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>

    <aside class="sidebar">
        <img src="assets/logo.svg" alt="XPL0DAY Icon" class="logo-icon">
        <div class="sidebar-logo">XPL<span>0</span>DAY</div>
        <nav class="sidebar-nav">
            <a href="dashboard_HTB.html">DASHBOARD</a>
            <a href="machines_HTB.html" class="active">MÁQUINAS</a>
            <a href="#">RETOS</a>
            <a href="#">ACADEMIA</a>
            <a href="#">EQUIPOS</a>
            <a href="#" id="logoutBtn" class="logout-link">⏻ DESCONECTAR</a>
        </nav>
        <div class="user-profile">
            <a href="profile_HTB.html" class="profile-link">
                <div class="avatar" id="sidebarAvatar">RT</div>
                <div class="user-info">
                    <p class="username" id="sidebarUsername">Root_User</p>
                    <p class="rank" id="sidebarRank">Script Kiddie</p>
                </div>
            </a>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <h1>Máquinas</h1>
            <div class="stats-overview">
                <div class="mini-stat">Completadas: <span id="completedCount">0</span></div>
                <div class="mini-stat">Total: <span>12</span></div>
            </div>
        </header>

        <!-- BARRA DE FILTROS Y BÚSQUEDA -->
        <section class="filters-bar">
            <div class="search-wrapper">
                <span class="search-icon">⌕</span>
                <input type="text" id="searchInput" placeholder="Buscar máquina..." />
            </div>
            <div class="filter-group">
                <span class="filter-label">DIFICULTAD:</span>
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn easy" data-filter="easy">Fácil</button>
                <button class="filter-btn medium" data-filter="medium">Media</button>
                <button class="filter-btn hard" data-filter="hard">Difícil</button>
                <button class="filter-btn insane" data-filter="insane">Insane</button>
            </div>
            <div class="filter-group">
                <span class="filter-label">SO:</span>
                <button class="filter-btn active" data-os="all">Todos</button>
                <button class="filter-btn" data-os="linux">🐧 Linux</button>
                <button class="filter-btn" data-os="windows">🪟 Windows</button>
            </div>
            <div class="filter-group">
                <span class="filter-label">ESTADO:</span>
                <button class="filter-btn active" data-status="all">Todos</button>
                <button class="filter-btn" data-status="active">Activa</button>
                <button class="filter-btn" data-status="retired">Retirada</button>
                <button class="filter-btn" data-status="completed">Completada</button>
            </div>
        </section>

        <!-- GRID DE MÁQUINAS -->
        <section class="machines-grid" id="machinesGrid">
            <!-- Generado por JS -->
        </section>

        <!-- MENSAJE SIN RESULTADOS -->
        <div class="no-results" id="noResults" style="display:none;">
            <p>[ No se encontraron máquinas con esos filtros ]</p>
        </div>

    </main>

    <script src="js/machines-logic_HTB.js"></script>
    <script src="js/enigma.js"></script>

</body>
</html>
